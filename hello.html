<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #ede9fe);
      color: #1e293b;
    }
    .card {
      text-align: center;
      padding: 56px 72px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.15);
    }
    h1 { font-size: 3rem; margin-bottom: 12px; }
    p { font-size: 1.1rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World! 👋</h1>
    <p>안녕하세요, 반갑습니다.</p>
  </div>
</body>
</html>
